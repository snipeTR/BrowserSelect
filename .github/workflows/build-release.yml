name: Build x64 installer and draft release

# Runs automatically on every push to master that touches the application (docs/tests only pushes are skipped).
# Every run builds Release|x64 and the NSIS installer (uploaded as an artifact).
# A DRAFT release is created automatically only when the app version (AssemblyFileVersion in
# BrowserSelect/Properties/AssemblyInfo.cs) has no release yet - so bumping the version is all that is
# needed to get a new draft; no manual run is required.
# There is deliberately no tag trigger: publishing a draft creates its tag, and that must not start
# another build/draft.
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'Tests/**'
      - 'help/**'
      - 'screenshots/**'
      - 'LICENSE'

permissions:
  contents: write

# one run at a time, so two quick pushes of the same new version can't both create a draft
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      CONFIGURATION: Release
      PLATFORM: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore BrowserSelect.sln

      - name: Build BrowserSelect (Release|x64)
        run: msbuild BrowserSelect\BrowserSelect.csproj /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }} /m /v:minimal

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $exe = "BrowserSelect\bin\x64\Release\BrowserSelect.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found: $exe" }
          $ver = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Install NSIS (if missing)
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          for ($i = 1; (-not $makensis) -and ($i -le 3); $i++) {
            Write-Host "Installing NSIS via Chocolatey (attempt $i)"
            choco install nsis -y --no-progress
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $makensis) { Start-Sleep -Seconds 15 }
          }
          if (-not $makensis) {
            Write-Host "Chocolatey failed; falling back to portable NSIS zip from SourceForge"
            $zip = Join-Path $env:RUNNER_TEMP "nsis.zip"
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip" -OutFile $zip -UserAgent "Wget" -MaximumRetryCount 3 -RetryIntervalSec 10
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
            $makensis = Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Filter makensis.exe | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makensis) { throw "makensis.exe not found" }
          Split-Path $makensis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Build installer
        working-directory: BrowserSelect
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          makensis /V3 "/DVERSION=$ver" "/DBUILD_DIR=.\bin\x64\Release" "/DOUTFILE=BrowserSelect-$ver-x64-Setup.exe" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Get-Item "BrowserSelect-$ver-x64-Setup.exe" | Format-List Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrowserSelect-${{ steps.version.outputs.version }}-x64-Setup
          path: BrowserSelect/BrowserSelect-*-x64-Setup.exe
          if-no-files-found: error

      - name: Check whether this version already has a release
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          # drafts are included (the token has write access); tags look like v<version> or v<version>-build.<n>
          $tags = gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed" }
          $pattern = '^v' + [regex]::Escape($ver) + '($|-)'
          $existing = @($tags | Where-Object { $_ -match $pattern })
          if ($existing.Count -gt 0) {
            Write-Host "Version $ver already released as: $($existing -join ', ') - no new draft."
            "release=false" >> $env:GITHUB_OUTPUT
            $list = $existing -join ', '
            "Version **$ver** already has a release ($list); build verified, no draft created. Bump the version in BrowserSelect/Properties/AssemblyInfo.cs to get a new draft." >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "New version $ver - a draft release will be created."
            "release=true" >> $env:GITHUB_OUTPUT
          }

      - name: Create draft release
        if: steps.check.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $tag = "v$ver-build.${{ github.run_number }}"
          $installer = "BrowserSelect/BrowserSelect-$ver-x64-Setup.exe"
          $notes = "Automated Windows x64 build of BrowserSelect $ver from commit ${{ github.sha }}.`n`nInstaller: per-user install (no admin rights), requires 64-bit Windows and .NET Framework 4.8."
          gh release create $tag $installer --draft --target "${{ github.sha }}" --title "BrowserSelect $ver (x64) - $tag" --notes $notes --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          "Draft release **$tag** created for version **$ver**." >> $env:GITHUB_STEP_SUMMARY
